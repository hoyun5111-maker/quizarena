<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Arena - Yönetim Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-height-screen font-sans">

    <div id="auth-screen" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <h1 class="text-2xl font-black text-indigo-400 mb-2">🔒 Admin Girişi</h1>
            <p class="text-slate-400 text-sm mb-6">Lütfen devam etmek için admin şifresini girin.</p>
            <input type="password" id="password-input" placeholder="Şifre" class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl text-center text-lg font-bold tracking-widest text-white focus:outline-none focus:border-indigo-500 mb-4">
            <button onclick="checkAdminPassword()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition">Giriş Yap</button>
            <p id="auth-error" class="text-red-400 text-sm font-semibold mt-4 hidden">Hatalı şifre kanka!</p>
        </div>
    </div>

    <div id="admin-panel" class="hidden max-w-5xl mx-auto p-4 md:p-8 space-y-8">
        
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl flex flex-col md:flex-row justify-between items-center gap-4 shadow-lg">
            <div>
                <h1 class="text-2xl font-extrabold text-indigo-400">🎛️ Quiz Arena Canlı Kontrol Merkezi</h1>
                <p class="text-slate-400 text-sm mt-1">Yarışmayı yönetin, yayını bağlayın ve skorları izleyin.</p>
            </div>
            <div class="flex gap-2">
                <input type="text" id="room-input" placeholder="Oda Kodu" class="bg-slate-900 border border-slate-600 rounded-xl px-4 py-2 font-bold uppercase w-40 text-center focus:outline-none focus:border-indigo-500">
                <button onclick="createRoom()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-2 rounded-xl transition shadow">Oda Kur</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            
            <div class="md:col-span-2 space-y-8">
                
                <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg space-y-4">
                    <h2 class="text-lg font-bold border-b border-slate-700 pb-2 text-indigo-300">📺 YouTube Entegrasyon İstasyonu</h2>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1">YouTube Canlı Yayın Video ID</label>
                            <input type="text" id="yt-input" placeholder="Örn: 5xK_7_d8w-w" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 mb-1">YouTube Chat ID (İsteğe Bağlı)</label>
                            <input type="text" id="chat-input" placeholder="Boş bırakılırsa Yayın ID kullanılır" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                    <button onclick="updateStream()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl transition shadow">Medya Verilerini Odalara Senkronize Et 📡</button>
                </div>

                <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg space-y-6">
                    <h2 class="text-lg font-bold border-b border-slate-700 pb-2 text-indigo-300">📝 Soru Yönetim İstasyonu</h2>
                    
                    <div class="flex gap-4 bg-slate-900 p-1 rounded-xl border border-slate-700">
                        <button onclick="switchType('choice')" id="type-choice-btn" class="flex-1 py-2 rounded-lg font-bold text-sm bg-indigo-600 text-white transition">Çoktan Seçmeli (Şıklı)</button>
                        <button onclick="switchType('text')" id="type-text-btn" class="flex-1 py-2 rounded-lg font-bold text-sm text-slate-400 hover:text-slate-200 transition">Klasik (Yazı Yazmalı)</button>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Soru Metni</label>
                            <textarea id="question-input" rows="2" placeholder="Soru metnini yazın kanka..." class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500"></textarea>
                        </div>

                        <div id="choice-fields" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs font-bold text-slate-400">A Seçeneği</label>
                                <input type="text" id="opt-a" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-2.5 text-sm mt-1 focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-400">B Seçeneği</label>
                                <input type="text" id="opt-b" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-2.5 text-sm mt-1 focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-400">C Seçeneği</label>
                                <input type="text" id="opt-c" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-2.5 text-sm mt-1 focus:outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-400">D Seçeneği</label>
                                <input type="text" id="opt-d" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-2.5 text-sm mt-1 focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label id="answer-label" class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Doğru Şık (A, B, C veya D)</label>
                                <input type="text" id="correct-input" placeholder="Örn: A" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 uppercase">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Soru Süresi (Saniye)</label>
                                <input type="number" id="duration-input" value="20" class="w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500">
                            </div>
                        </div>

                        <button onclick="sendQuestion()" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-4 rounded-xl transition shadow-lg text-lg transform hover:-translate-y-0.5">Soruyu Odadaki Herkese Gönder 🚀</button>
                    </div>
                </div>
            </div>

            <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-lg flex flex-col h-[560px]">
                <h2 class="text-lg font-bold border-b border-slate-700 pb-2 text-yellow-400 flex justify-between items-center">
                    <span>🏆 Canlı Skor Tablosu</span>
                    <span id="live-timer" class="text-sm bg-slate-900 border border-slate-700 px-3 py-1 rounded-full text-indigo-400 hidden">0s</span>
                </h2>
                <div id="leaderboard-list" class="mt-4 space-y-2 flex-1 overflow-y-auto pr-1">
                    <p class="text-slate-500 text-sm text-center py-8">Henüz odaya katılan oyuncu yok.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoom = "";
        let currentType = "choice";

        function checkAdminPassword() {
            const pass = document.getElementById("password-input").value;
            if(pass === "zurafa") {
                document.getElementById("auth-screen").classList.add("hidden");
                document.getElementById("admin-panel").classList.remove("hidden");
            } else {
                const err = document.getElementById("auth-error");
                err.classList.remove("hidden");
                setTimeout(() => err.classList.add("hidden"), 3000);
            }
        }

        function switchType(type) {
            currentType = type;
            const choiceBtn = document.getElementById("type-choice-btn");
            const textBtn = document.getElementById("type-text-btn");
            const choiceFields = document.getElementById("choice-fields");
            const answerLabel = document.getElementById("answer-label");
            const correctInput = document.getElementById("correct-input");

            if(type === "text") {
                choiceBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm text-slate-400 hover:text-slate-200 transition";
                textBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm bg-indigo-600 text-white transition";
                choiceFields.classList.add("hidden");
                answerLabel.innerText = "Doğru Kelime / Cevap Metni";
                correctInput.placeholder = "Örn: Çin";
                correctInput.className = "w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500";
            } else {
                choiceBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm bg-indigo-600 text-white transition";
                textBtn.className = "flex-1 py-2 rounded-lg font-bold text-sm text-slate-400 hover:text-slate-200 transition";
                choiceFields.classList.remove("hidden");
                answerLabel.innerText = "Doğru Şık (A, B, C veya D)";
                correctInput.placeholder = "Örn: A";
                correctInput.className = "w-full bg-slate-900 border border-slate-600 rounded-xl p-3 text-sm focus:outline-none focus:border-indigo-500 uppercase";
            }
        }

        function createRoom() {
            const room = document.getElementById("room-input").value.trim().toUpperCase();
            if(!room) return alert("Oda kodu boş olamaz kanka!");

            socket.emit("joinRoom", { room, name: "Yayıncı", role: "admin" }, (response) => {
                if(response.success) {
                    currentRoom = room;
                    alert(`Oda #${room} başarıyla kuruldu ve yönetim bağlandı!`);
                } else {
                    alert(response.message);
                }
            });
        }

        function updateStream() {
            const ytId = document.getElementById("yt-input").value.trim();
            const chatId = document.getElementById("chat-input").value.trim();
            if(!currentRoom) return alert("Önce odayı kurmalısın kanka!");
            if(!ytId) return alert("Lütfen geçerli bir YouTube Video ID girin.");

            socket.emit("setStream", { room: currentRoom, youtubeId: ytId, chatId: chatId });
            alert("Canlı yayın ve Chat bağlantısı başarıyla senkronize edildi!");
        }

        function sendQuestion() {
            if(!currentRoom) return alert("Önce bir oda oluşturmalısın kanka!");
            
            const question = document.getElementById("question-input").value.trim();
            const correctAnswer = document.getElementById("correct-input").value.trim();
            const duration = parseInt(document.getElementById("duration-input").value) || 20;

            if(!question || !correctAnswer) return alert("Soru ve doğru cevap boş bırakılamaz.");

            let questionData = {
                room: currentRoom,
                type: currentType,
                question: question,
                correctAnswer: correctAnswer,
                duration: duration
            };

            if(currentType === "choice") {
                questionData.a = document.getElementById("opt-a").value.trim();
                questionData.b = document.getElementById("opt-b").value.trim();
                questionData.c = document.getElementById("opt-c").value.trim();
                questionData.d = document.getElementById("opt-d").value.trim();
                questionData.correctAnswer = correctAnswer.toUpperCase();

                if(!questionData.a || !questionData.b) return alert("Çoktan seçmeli soruda en az A ve B şıkları dolu olmalıdır.");
            }

            socket.emit("startQuestion", questionData);
            document.getElementById("live-timer").classList.remove("hidden");
        }

        socket.on("tick", (time) => {
            document.getElementById("live-timer").innerText = time + "s";
        });

        socket.on("questionEnded", () => {
            document.getElementById("live-timer").classList.add("hidden");
        });

        socket.on("updateLeaderboard", (scores) => {
            const listEl = document.getElementById("leaderboard-list");
            listEl.innerHTML = "";

            const sortedPlayers = Object.entries(scores).sort((a, b) => b[1] - a[1]);

            if(sortedPlayers.length === 0) {
                listEl.innerHTML = '<p class="text-slate-500 text-sm text-center py-8">Henüz odaya katılan oyuncu yok.</p>';
                return;
            }

            sortedPlayers.forEach(([name, score], idx) => {
                let medal = "⚪";
                if(idx === 0) medal = "🥇";
                if(idx === 1) medal = "🥈";
                if(idx === 2) medal = "🥉";

                const row = document.createElement("div");
                row.className = "flex justify-between items-center bg-slate-900 border border-slate-700/60 p-3 rounded-xl";
                row.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-base">${medal}</span>
                        <span class="font-bold text-sm ${idx===0 ? 'text-yellow-400': 'text-slate-200'}">${name}</span>
                    </div>
                    <span class="bg-indigo-950 text-indigo-400 text-xs font-black border border-indigo-800 px-3 py-1 rounded-md">${score} Puan</span>
                `;
                listEl.appendChild(row);
            });
        });
    </script>
</body>
</html>
