<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Quiz Arena - Admin</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #2d3436; color: #fff; padding: 20px; display: flex; gap: 20px; }
        .left-side { flex: 1.5; }
        .right-side { flex: 1; background: #353b48; padding: 20px; border-radius: 10px; height: fit-content; max-height: 85vh; overflow-y: auto;}
        .box { background: #353b48; padding: 20px; border-radius: 10px; margin-bottom: 15px; }
        input, select, button { width: 100%; padding: 12px; margin: 6px 0; border-radius: 6px; border: none; box-sizing: border-box; font-size: 15px;}
        button { background: #44bd32; color: white; font-weight: bold; cursor: pointer; }
        .stop-btn { background: #c23616; margin-top: 10px; }
        .player-row { display: flex; justify-content: space-between; background: #2d3436; padding: 12px; margin: 6px 0; border-radius: 6px; border-left: 5px solid #6c5ce7; }
        .rank-1 { border-left-color: #f1c40f; background: #485460; }
    </style>
</head>
<body>

    <div class="left-side">
        <h2>Quiz Arena Yönetim Paneli 👑</h2>
        <div class="box">
            <h3>1. Oda Kurulumu</h3>
            <input type="text" id="roomCode" placeholder="ODA KODU (Örn: TEST)">
            <button onclick="createRoom()">ODAYI ETKİNLEŞTİR</button>
            <p id="status" style="color:#fbc531; font-weight:bold; margin-top:10px;"></p>
        </div>

        <div class="box">
            <h3>2. Soru ve Medya Paneli</h3>
            <input type="text" id="qText" placeholder="Soru metni...">
            <input type="text" id="qAns" placeholder="Doğru Cevap (Şıklıysa 0, 1, 2 veya 3)">
            <input type="number" id="qTime" value="30" placeholder="Süre">
            
            <select id="qMode">
                <option value="quiz">Quiz Modu (Hız Bonuslu)</option>
                <option value="tabu">Tabu Modu</option>
            </select>

            <select id="qType" onchange="toggleOptions()">
                <option value="text">Klasik Metin</option>
                <option value="multiple">Çoktan Seçmeli (4 Şık)</option>
            </select>

            <div id="options-box" style="display:none; border: 1px dashed #718093; padding: 10px; margin: 5px 0;">
                <input type="text" id="opt0" placeholder="A Şıkkı">
                <input type="text" id="opt1" placeholder="B Şıkkı">
                <input type="text" id="opt2" placeholder="C Şıkkı">
                <input type="text" id="opt3" placeholder="D Şıkkı">
            </div>

            <div style="margin-top: 15px; border-top: 1px solid #57606f; padding-top: 10px;">
                <label style="font-size:13px; color:#a4b0be;">YouTube Canlı Yayın ID:</label>
                <input type="text" id="streamId" placeholder="Örn: 5g2h_R9wXq8">
                
                <label style="font-size:13px; color:#a4b0be;">YouTube Canlı Chat ID:</label>
                <input type="text" id="chatId" placeholder="Örn: 5g2h_R9wXq8">
            </div>

            <button style="margin-top:15px;" onclick="sendQuestion()">SORUYU BAŞLAT 🚀</button>
            <button class="stop-btn" onclick="forceStop()">SÜREYİ KES 🛑</button>
        </div>
    </div>

    <div class="right-side">
        <h3 style="border-bottom: 2px solid #6c5ce7; padding-bottom: 8px; margin-top: 0;">Katılımcılar & Skorlar 🏆</h3>
        <div id="leaderboard-list">
            <p style="color:#a4b0be; font-style:italic;">Oyuncu bekleniyor...</p>
        </div>
    </div>

    <script>
        const socket = io();
        let activeRoom = "";

        function createRoom() {
            const code = document.getElementById('roomCode').value.toUpperCase().trim();
            if(!code) return alert("Kod girin!");
            socket.emit('createRoom', { roomId: code });
        }

        socket.on('roomCreated', (id) => {
            activeRoom = id;
            document.getElementById('status').innerText = `Oda Kuruldu: ${activeRoom}`;
        });

        function toggleOptions() {
            const type = document.getElementById('qType').value;
            document.getElementById('options-box').style.display = (type === 'multiple') ? 'block' : 'none';
        }

        socket.on('updatePlayers', players => {
            const listContainer = document.getElementById('leaderboard-list');
            listContainer.innerHTML = "";
            if(players.length === 0) {
                listContainer.innerHTML = '<p style="color:#a4b0be; font-style:italic;">Oyuncu yok.</p>';
                return;
            }
            const sorted = [...players].sort((a,b) => b.score - a.score);
            sorted.forEach((p, idx) => {
                const row = document.createElement('div');
                row.className = `player-row ${idx === 0 ? 'rank-1' : ''}`;
                row.innerHTML = `<span><b>#${idx + 1}</b> ` + p.username + `</span><span><b>` + p.score + ` P</b></span>`;
                listContainer.appendChild(row);
            });
        });

        function sendQuestion() {
            if(!activeRoom) return alert("Oda yok!");
            const text = document.getElementById('qText').value;
            const answer = document.getElementById('qAns').value;
            const timeLeft = document.getElementById('qTime').value;
            const mode = document.getElementById('qMode').value;
            const type = document.getElementById('qType').value;
            const streamId = document.getElementById('streamId').value.trim();
            const chatId = document.getElementById('chatId').value.trim();

            let options = [];
            if(type === 'multiple') {
                options = [
                    document.getElementById('opt0').value,
                    document.getElementById('opt1').value,
                    document.getElementById('opt2').value,
                    document.getElementById('opt3').value
                ];
            }

            socket.emit('startQuestion', {
                roomId: activeRoom, text, answer, timeLeft, mode, type, options, streamId, chatId
            });
        }

        function forceStop() { if(activeRoom) socket.emit('adminForceTimeUp', { roomId: activeRoom }); }
    </script>
</body>
</html>
