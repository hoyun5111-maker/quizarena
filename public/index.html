<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Arena - Oyuncu Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
            min-height: 100vh;
        }
        .cloud {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: float 20s linear infinite;
        }
        @keyframes float {
            0% { transform: translateX(-100%) translateY(0); }
            100% { transform: translateX(100vw) translateY(-50px); }
        }
    </style>
</head>
<body class="relative overflow-x-hidden font-sans flex items-center justify-center p-2 md:p-6">

    <div class="cloud w-32 h-12 top-10 -left-32 rounded-full"></div>
    <div class="cloud w-48 h-16 top-40 -left-48 rounded-full" style="animation-delay: 5s; animation-duration: 25s;"></div>

    <div id="login-screen" class="bg-white/90 backdrop-blur shadow-2xl rounded-2xl p-8 max-w-md w-full text-center z-10">
        <h1 class="text-3xl font-extrabold text-indigo-700 mb-2">🚀 Quiz Arena</h1>
        <p class="text-gray-500 mb-6">Odaya katıl ve canlı yayında yarışmaya başla!</p>
        
        <div class="space-y-4">
            <input type="text" id="room-input" placeholder="Oda Kodu (Örn: YAYIN)" class="w-full px-4 py-3 border-2 border-indigo-200 rounded-xl focus:outline-none focus:border-indigo-500 font-bold uppercase tracking-wider text-center text-lg">
            <input type="text" id="name-input" placeholder="Kullanıcı Adın" class="w-full px-4 py-3 border-2 border-indigo-200 rounded-xl focus:outline-none focus:border-indigo-500 text-center text-lg">
            <button onclick="joinRoom()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition shadow-lg transform hover:-translate-y-0.5 text-lg">Odaya Katıl</button>
        </div>
        <p id="login-error" class="text-red-500 mt-4 font-semibold hidden"></p>
    </div>

    <div id="game-screen" class="hidden w-full max-w-7xl bg-white/95 backdrop-blur shadow-2xl rounded-2xl p-4 md:p-5 z-10 flex flex-col lg:flex-row gap-5">
        
        <div class="w-full lg:w-8/12 flex flex-col justify-center">
            <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden shadow-lg border border-gray-200">
                <iframe id="yt-stream" class="absolute top-0 left-0 w-full h-full hidden" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                <div id="no-stream-msg" class="absolute inset-0 flex items-center justify-center text-gray-400 font-medium">Yayın henüz bağlanmadı.</div>
            </div>
        </div>

        <div class="w-full lg:w-4/12 flex flex-col gap-4">
            
            <div class="bg-indigo-50/70 p-5 rounded-xl border border-indigo-100 shadow-sm">
                <div class="flex justify-between items-center mb-4">
                    <span id="player-identity" class="bg-indigo-200 text-indigo-800 text-xs font-bold px-3 py-1 rounded-full">Oyuncu</span>
                    <span id="player-score" class="bg-yellow-400 text-yellow-900 text-xs font-extrabold px-3 py-1 rounded-full">Skor: 0</span>
                </div>

                <div id="question-box" class="text-center">
                    <h2 id="question-text" class="text-lg font-bold text-gray-800 whitespace-pre-line">Soru bekleniyor...</h2>
                    <div id="timer-box" class="mt-3 text-2xl font-black text-indigo-600 hidden">Süre: <span id="timer">0</span></div>
                </div>

                <div id="options-box" class="grid grid-cols-2 gap-3 mt-4 hidden">
                    <button onclick="sendAnswer('A')" class="opt-btn bg-white hover:bg-indigo-600 hover:text-white border border-indigo-200 text-indigo-700 font-bold py-3 px-2 rounded-xl text-sm transition shadow-sm">A</button>
                    <button onclick="sendAnswer('B')" class="opt-btn bg-white hover:bg-indigo-600 hover:text-white border border-indigo-200 text-indigo-700 font-bold py-3 px-2 rounded-xl text-sm transition shadow-sm">B</button>
                    <button onclick="sendAnswer('C')" class="opt-btn bg-white hover:bg-indigo-600 hover:text-white border border-indigo-200 text-indigo-700 font-bold py-3 px-2 rounded-xl text-sm transition shadow-sm">C</button>
                    <button onclick="sendAnswer('D')" class="opt-btn bg-white hover:bg-indigo-600 hover:text-white border border-indigo-200 text-indigo-700 font-bold py-3 px-2 rounded-xl text-sm transition shadow-sm">D</button>
                </div>

                <div id="text-answer-box" class="hidden space-y-2 mt-4">
                    <input type="text" id="text-answer-input" placeholder="Cevabınızı buraya yazın..." class="w-full px-4 py-2.5 border-2 border-indigo-200 rounded-xl focus:outline-none focus:border-indigo-500 font-medium text-base text-center">
                    <button onclick="sendTextAnswer()" id="text-answer-submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-xl transition shadow-md">Cevabı Gönder</button>
                </div>

                <div id="status-msg" class="text-center text-xs font-semibold text-gray-500 mt-4 pt-2 border-t border-indigo-100">
                    Oda sahibinin soruyu başlatması bekleniyor.
                </div>
            </div>

            <div class="flex-1 min-h-[320px] lg:min-h-[380px] bg-gray-50 rounded-xl border border-gray-200 flex flex-col overflow-hidden shadow-inner relative">
                
                <div id="chat-header-actions" class="bg-white border-b border-gray-200 p-2 flex justify-between items-center hidden">
                    <span class="text-xs font-bold text-gray-600 pl-1">💬 Canlı Sohbet</span>
                    <a id="yt-external-chat-btn" href="#" target="_blank" class="bg-red-500 hover:bg-red-600 text-white text-[11px] font-bold px-2.5 py-1 rounded-md transition shadow-sm flex items-center gap-1">
                        🔑 Sohbeti Aktif Et / Yaz
                    </a>
                </div>

                <div class="flex-1 relative w-full h-full">
                    <iframe id="yt-chat" class="w-full h-full hidden" src="" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
                    <div id="no-chat-msg" class="absolute inset-0 flex items-center justify-center text-gray-400 text-sm font-medium">Sohbet henüz bağlanmadı.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoom = "";
        let myName = "";
        let hasAnswered = false;

        function joinRoom() {
            const room = document.getElementById("room-input").value.trim().toUpperCase();
            const name = document.getElementById("name-input").value.trim();
            const errorEl = document.getElementById("login-error");

            if(!room || !name) {
                errorEl.innerText = "Lütfen tüm alanları doldurun kanka!";
                errorEl.classList.remove("hidden");
                return;
            }

            socket.emit("joinRoom", { room, name, role: "player" }, (response) => {
                if(response.success) {
                    currentRoom = room;
                    myName = name;
                    document.getElementById("login-screen").classList.add("hidden");
                    document.getElementById("game-screen").classList.remove("hidden");
                    document.getElementById("player-identity").innerText = `${name} (#${room})`;
                    
                    if(response.youtubeId) {
                        updateYoutubeElements(response.youtubeId, response.chatId);
                    }
                } else {
                    errorEl.innerText = response.message;
                    errorEl.classList.remove("hidden");
                }
            });
        }

        function updateYoutubeElements(ytId, chatId) {
            if(ytId) {
                const streamFrame = document.getElementById("yt-stream");
                const chatFrame = document.getElementById("yt-chat");
                const finalChatId = chatId || ytId; // Eğer özel chat id yoksa yayın id kullan
                
                streamFrame.src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
                streamFrame.classList.remove("hidden");
                document.getElementById("no-stream-msg").classList.add("hidden");

                const currentDomain = window.location.hostname;
                chatFrame.src = `https://www.youtube.com/live_chat?v=${finalChatId}&embed_domain=${currentDomain}`;
                chatFrame.classList.remove("hidden");
                document.getElementById("no-chat-msg").classList.add("hidden");

                // Dış bağlantı linkini ayarla ve butonu göster
                document.getElementById("yt-external-chat-btn").href = `https://www.youtube.com/live_chat?v=${finalChatId}`;
                document.getElementById("chat-header-actions").classList.remove("hidden");
            }
        }

        socket.on("updateStream", (data) => {
            updateYoutubeElements(data.youtubeId, data.chatId);
        });

        socket.on("newQuestion", (questionData) => {
            hasAnswered = false;
            document.getElementById("question-text").innerText = questionData.question;
            document.getElementById("timer-box").classList.remove("hidden");
            document.getElementById("status-msg").innerText = "Soru aktif! Cevap verebilirsin.";
            document.getElementById("status-msg").className = "text-center text-xs font-semibold text-green-600 mt-4 pt-2 border-t border-indigo-100";

            const optButtons = document.querySelectorAll(".opt-btn");
            optButtons.forEach(btn => {
                btn.disabled = false;
                btn.className = "opt-btn bg-white hover:bg-indigo-600 hover:text-white border border-indigo-200 text-indigo-700 font-bold py-3 px-2 rounded-xl text-sm transition shadow-sm";
            });

            const textInput = document.getElementById("text-answer-input");
            textInput.value = "";
            textInput.disabled = false;
            document.getElementById("text-answer-submit").disabled = false;

            if(questionData.type === "text") {
                document.getElementById("options-box").classList.add("hidden");
                document.getElementById("text-answer-box").classList.remove("hidden");
            } else {
                document.getElementById("text-answer-box").classList.add("hidden");
                document.getElementById("options-box").classList.remove("hidden");
                optButtons[0].innerText = "A) " + (questionData.a || "A");
                optButtons[1].innerText = "B) " + (questionData.b || "B");
                optButtons[2].innerText = "C) " + (questionData.c || "C");
                optButtons[3].innerText = "D) " + (questionData.d || "D");
            }
        });

        socket.on("tick", (time) => {
            document.getElementById("timer").innerText = time;
        });

        function sendAnswer(option) {
            if(hasAnswered) return;
            hasAnswered = true;
            
            const optButtons = document.querySelectorAll(".opt-btn");
            optButtons.forEach(btn => {
                btn.disabled = true;
                if(!btn.innerText.startsWith(option)) {
                    btn.classList.add("opacity-50");
                } else {
                    btn.className = "opt-btn bg-indigo-600 text-white border border-indigo-600 font-bold py-3 px-2 rounded-xl text-sm transition shadow-sm";
                }
            });

            socket.emit("submitAnswer", { room: currentRoom, name: myName, answer: option });
            document.getElementById("status-msg").innerText = "Cevabın iletildi, süre sonu bekleniyor...";
            document.getElementById("status-msg").className = "text-center text-xs font-semibold text-amber-600 mt-4 pt-2 border-t border-indigo-100";
        }

        function sendTextAnswer() {
            if(hasAnswered) return;
            const answerVal = document.getElementById("text-answer-input").value.trim();
            if(!answerVal) return;

            hasAnswered = true;
            document.getElementById("text-answer-input").disabled = true;
            document.getElementById("text-answer-submit").disabled = true;

            socket.emit("submitAnswer", { room: currentRoom, name: myName, answer: answerVal });
            document.getElementById("status-msg").innerText = "Yazılı cevabın iletildi, süre sonu bekleniyor...";
            document.getElementById("status-msg").className = "text-center text-xs font-semibold text-amber-600 mt-4 pt-2 border-t border-indigo-100";
        }

        socket.on("questionEnded", (resultData) => {
            document.getElementById("timer-box").classList.add("hidden");
            document.getElementById("options-box").classList.add("hidden");
            document.getElementById("text-answer-box").classList.add("hidden");
            
            document.getElementById("question-text").innerText = `Süre Bitti!\nDoğru Cevap: ${resultData.correctAnswer}`;
            
            if(resultData.scores && resultData.scores[myName] !== undefined) {
                document.getElementById("player-score").innerText = `Skor: ${resultData.scores[myName]}`;
            }

            document.getElementById("status-msg").innerText = "Yeni soru bekleniyor...";
            document.getElementById("status-msg").className = "text-center text-xs font-semibold text-gray-500 mt-4 pt-2 border-t border-indigo-100";
        });
    </script>
</body>
</html>
