<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Arena - Canlı Takip Paneli</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; }
        .pulse-live { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="text-slate-100 font-sans flex items-center justify-center p-2 md:p-4">

    <div id="login-screen" class="bg-slate-800 border border-slate-700 shadow-2xl rounded-2xl p-8 max-w-md w-full text-center">
        <h1 class="text-3xl font-black text-indigo-400 mb-2">🚀 Quiz Arena</h1>
        <p class="text-slate-400 mb-6">Yarışma odasına bağlan ve skorunu canlı takip et!</p>
        <div class="space-y-4">
            <input type="text" id="room-input" placeholder="Oda Kodu (Örn: YAYIN)" class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl text-center text-lg font-bold uppercase tracking-wider focus:outline-none focus:border-indigo-500">
            <input type="text" id="name-input" placeholder="YouTube Kullanıcı Adın" class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-xl text-center text-lg focus:outline-none focus:border-indigo-500">
            <button onclick="joinRoom()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition text-lg">Arenaya Gir</button>
        </div>
        <p id="login-error" class="text-red-400 mt-4 font-semibold hidden"></p>
    </div>

    <div id="game-screen" class="hidden w-full max-w-7xl bg-slate-900/90 border border-slate-800 shadow-2xl rounded-2xl p-4 flex flex-col lg:flex-row gap-5">
        
        <div class="w-full lg:w-8/12 flex flex-col justify-center">
            <div class="relative w-full aspect-video bg-black rounded-xl overflow-hidden border border-slate-800">
                <iframe id="yt-stream" class="absolute top-0 left-0 w-full h-full hidden" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                <div id="no-stream-msg" class="absolute inset-0 flex items-center justify-center text-slate-500">Yayın bekleniyor...</div>
            </div>
        </div>

        <div class="w-full lg:w-4/12 flex flex-col gap-4">
            
            <div class="bg-slate-800 border border-slate-700 p-5 rounded-xl shadow-lg text-center">
                <div class="flex justify-between items-center mb-3">
                    <span id="player-identity" class="bg-indigo-950 border border-indigo-800 text-xs font-bold px-3 py-1 rounded-full text-indigo-300">Oyuncu</span>
                    <span id="player-score" class="bg-yellow-500 text-slate-950 text-xs font-black px-3 py-1 rounded-full">Skor: 0</span>
                </div>
                <div class="py-2">
                    <h2 id="question-text" class="text-lg font-bold text-slate-200">Soru bekleniyor kanka...</h2>
                    <div id="timer-box" class="mt-2 text-2xl font-black text-indigo-400 hidden">Süre: <span id="timer">0</span>s</div>
                </div>
                <div id="action-alert" class="hidden bg-red-950/40 border border-red-950 p-2.5 rounded-xl mt-2 pulse-live text-xs text-red-400 font-bold">
                    🚨 Cevabını hemen YouTube Canlı Sohbetine yaz! İlk bilen puanı kapar!
                </div>
            </div>

            <div id="var-box" class="hidden bg-slate-800 border border-emerald-800/60 p-4 rounded-xl shadow-lg">
                <p class="text-xs font-bold text-emerald-400 mb-2 tracking-wider flex items-center gap-1">🖥️ YOUTUBE SUNUCU KAYDI (VAR KESİTİ)</p>
                <div class="space-y-1.5 text-xs font-mono bg-slate-950 p-3 rounded-lg border border-slate-800">
                    <div id="var-prev" class="text-slate-500"></div>
                    <div id="var-winner" class="text-emerald-400 font-bold border-y border-emerald-900/50 py-0.5 bg-emerald-950/30"></div>
                    <div id="var-next" class="text-slate-500"></div>
                </div>
            </div>

            <div class="flex-1 min-h-[250px] bg-slate-950 border border-slate-800 rounded-xl overflow-hidden flex flex-col relative">
                <div class="bg-slate-900 border-b border-slate-800 p-2 text-xs font-bold text-slate-400">💬 Canlı Sohbet</div>
                <div class="flex-1 relative">
                    <iframe id="yt-chat" class="w-full h-full hidden" src="" sandbox="allow-scripts allow-same-origin"></iframe>
                    <div id="no-chat-msg" class="absolute inset-0 flex items-center justify-center text-slate-600 text-xs">Sohbet yükleniyor...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoom = "", myName = "";

        function joinRoom() {
            const room = document.getElementById("room-input").value.trim().toUpperCase();
            const name = document.getElementById("name-input").value.trim();
            if(!room || !name) return;

            socket.emit("joinRoom", { room, name, role: "player" }, (response) => {
                if(response.success) {
                    currentRoom = room; myName = name;
                    document.getElementById("login-screen").classList.add("hidden");
                    document.getElementById("game-screen").classList.remove("hidden");
                    document.getElementById("player-identity").innerText = `${name} (#${room})`;
                    if(response.youtubeId) updateYoutubeElements(response.youtubeId, response.chatId);
                } else {
                    document.getElementById("login-error").innerText = response.message;
                    document.getElementById("login-error").classList.remove("hidden");
                }
            });
        }

        function updateYoutubeElements(ytId, chatId) {
            const finalChatId = chatId || ytId;
            document.getElementById("yt-stream").src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
            document.getElementById("yt-stream").classList.remove("hidden");
            document.getElementById("no-stream-msg").classList.add("hidden");

            document.getElementById("yt-chat").src = `https://www.youtube.com/live_chat?v=${finalChatId}&embed_domain=${window.location.hostname}`;
            document.getElementById("yt-chat").classList.remove("hidden");
            document.getElementById("no-chat-msg").classList.add("hidden");
        }

        socket.on("updateStream", (data) => updateYoutubeElements(data.youtubeId, data.chatId));

        socket.on("newQuestion", (data) => {
            document.getElementById("var-box").classList.add("hidden");
            document.getElementById("question-text").innerText = data.question;
            document.getElementById("timer-box").classList.remove("hidden");
            document.getElementById("action-alert").classList.remove("hidden");
        });

        socket.on("tick", (time) => document.getElementById("timer").innerText = time);

        socket.on("questionEnded", (data) => {
            document.getElementById("timer-box").classList.add("hidden");
            document.getElementById("action-alert").classList.add("hidden");
            
            if(data.winner) {
                document.getElementById("question-text").innerText = `Soru Çözüldü!\nKazanan: ${data.winner}\nCevap: ${data.correctAnswer}`;
                if(data.varKesiti) {
                    document.getElementById("var-prev").innerText = data.varKesiti.onceki;
                    document.getElementById("var-winner").innerText = "⭐ " + data.varKesiti.kazanan;
                    document.getElementById("var-next").innerText = data.varKesiti.sonraki;
                    document.getElementById("var-box").classList.remove("hidden");
                }
            } else {
                document.getElementById("question-text").innerText = `Süre Bitti!\nDoğru Cevap: ${data.correctAnswer}\nKimse bilemedi kanka!`;
            }
            
            if(data.scores && data.scores[myName] !== undefined) {
                document.getElementById("player-score").innerText = `Skor: ${data.scores[myName]}`;
            }
        });
    </script>
</body>
</html>
